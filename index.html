<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madina Herbal & Dry Fruit - Premium Quality</title>
    
    <!-- FontAwesome & Google Fonts for Modern Typography -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* RESET & PREMIUM BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #fbf9f4;
            color: #2c2520;
            line-height: 1.6;
            padding-bottom: 20px;
        }

        /* HEADER & NAVBAR (Resham Silk Style) */
        header {
            background: rgba(251, 249, 244, 0.96);
            color: #2c2520;
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(61, 90, 55, 0.1);
            backdrop-filter: blur(10px);
        }
        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #3d5a37;
            font-weight: 700;
        }
        .logo p {
            font-size: 0.75rem;
            color: #61564d;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* HERO SECTION (Premium Banner) */
        .hero {
            position: relative;
            min-height: 50vh;
            background: linear-gradient(rgba(44, 37, 32, 0.4), rgba(44, 37, 32, 0.45)), 
                        url('https://unsplash.com') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 4rem 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .hero-content {
            max-width: 800px;
        }
        .hero-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            margin-bottom: 1.2rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: 600;
            line-height: 1.2;
        }
        .hero-content h2 span {
            font-style: italic;
            color: #fbf9f4;
            opacity: 0.95;
        }

        .highlight-tag {
            display: inline-block;
            background: #c28e2b;
            color: #ffffff;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(194, 142, 43, 0.2);
        }

        .shop-now-btn {
            background: #3d5a37;
            color: #fff;
            padding: 0.9rem 2.6rem;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(61, 90, 55, 0.25);
        }
        .shop-now-btn:hover {
            background: #2b3f27;
            transform: translateY(-2px);
        }

        /* SEARCH BAR */
        .search-container {
            max-width: 600px;
            margin: 0.5rem auto 2.5rem auto;
            padding: 0 15px;
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid rgba(61, 90, 55, 0.2);
            border-radius: 8px;
            padding: 6px 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .search-wrapper i {
            color: #3d5a37;
            font-size: 1.1rem;
            margin-right: 12px;
        }
        .search-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            padding: 8px 5px;
            font-size: 0.95rem;
            background: transparent;
            color: #2c2520;
        }

        /* SECTION HEADER BLOCK */
        .section-header {
            max-width: 1200px;
            margin: 2.5rem auto 0.5rem auto;
            padding: 0 3% 0.5rem 3%;
            color: #3d5a37;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-header i {
            color: #c28e2b;
            font-size: 1.5rem;
        }

        .category-subtitle {
            max-width: 1200px;
            margin: 1rem auto 0.8rem auto;
            padding: 4px 15px 4px 12px;
            color: #61564d;
            font-size: 1.05rem;
            font-weight: 600;
            border-left: 3px solid #c28e2b;
            display: block;
        }

        /* HIGH END PRODUCT GRID */
        .products-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0.5rem 3% 2.5rem 3%;
        }

        @media (min-width: 768px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
            .hero-content h2 { font-size: 3.5rem; }
        }
        @media (min-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); }
        }
        
        /* CARD MODIFICATIONS */
        .product-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.015);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 1px solid rgba(61, 90, 55, 0.06);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(44, 37, 32, 0.06);
            border-color: rgba(61, 90, 55, 0.15);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #f7f5f0;
            transition: transform 0.5s;
        }
        .product-card:hover img {
            transform: scale(1.03);
        }
        .product-details {
            padding: 1.2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2c2520;
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price {
            color: #3d5a37;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }
        .add-to-cart-btn {
            background: #3d5a37;
            color: #fff;
            border: none;
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background: #2b3f27;
        }

        /* ACTIONS */
        .cart-trigger-btn {
            background: none;
            border: none;
            position: relative;
            cursor: pointer;
            font-size: 1.3rem;
            color: #3d5a37;
            padding: 8px;
            display: flex;
            align-items: center;
        }
        .cart-badge-count {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: #c28e2b;
            color: #fff;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .whatsapp-nav-btn {
            background-color: #3d5a37;
            color: #fff;
            padding: 9px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s;
        }
        .whatsapp-nav-btn:hover {
            background-color: #2b3f27;
        }

        /* PREMIUM SLIDEOUT CART DRAWER */
        .cart-sidebar-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background-color: #fff;
            box-shadow: -10px 0 40px rgba(0,0,0,0.08);
            z-index: 2000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
